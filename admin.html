<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1d17">
<title>Admin – Weihnachtswunschliste</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>
:root {
    color-scheme: dark;

    --bg: #0e1d17;
    --surface: #1a3125;
    --surface-2: #234233;
    --ink: #060b08;

    --text: #fff3d1;
    --muted: #d3c6a3;
    --border: #f1e2b8;

    --gold: #e5b046;
    --burgundy: #5a1a25;
    --red: #b3202f;
    --red-hover: #c9303f;
    --red-text: #ffd9d3;

    --bw: 3px;
    --shadow: 5px 5px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
}

* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 32px 18px 44px;
    color: var(--text);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(229, 176, 70, 0.14),
            transparent 40%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(179, 32, 47, 0.16),
            transparent 40%
        ),
        var(--bg);
    font-family:
        "Segoe UI", system-ui, -apple-system,
        Tahoma, Verdana, Arial, sans-serif;
    line-height: 1.5;
}

[hidden] {
    display: none !important;
}

.admin-page {
    width: min(880px, 100%);
    margin: 0 auto;
}

/* ---------- Kopf ---------- */

.admin-header {
    margin-bottom: 30px;
    padding: 22px 24px;
    color: var(--ink);
    background: var(--gold);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow:
        var(--shadow),
        0 0 0 var(--bw) var(--border);
}

.eyebrow {
    margin: 0 0 8px;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    font-family: "Mountains of Christmas", Georgia, serif;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    font-weight: 700;
    line-height: 1.05;
}

.intro {
    max-width: 620px;
    margin: 14px 0 0;
    color: #2a1c05;
    font-weight: 600;
}

h2 {
    margin: 0 0 16px;
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

/* ---------- Bereiche ---------- */

.panel {
    margin-bottom: 28px;
    padding: 22px;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow:
        var(--shadow),
        0 0 0 var(--bw) rgba(241, 226, 184, 0.28);
}

.login-panel {
    max-width: 520px;
    margin-right: auto;
    margin-left: auto;
}

.hint {
    margin: -4px 0 18px;
    color: var(--muted);
    font-size: 0.88rem;
}

/* ---------- Formulare ---------- */

.field {
    display: block;
    margin-bottom: 14px;
}

.field-label {
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 0.84rem;
    font-weight: 700;
}

input,
select,
textarea {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    color: var(--text);
    background: var(--bg);
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
    font: inherit;
    font-size: 1rem;
}

textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.5;
}

input::placeholder,
textarea::placeholder {
    color: #a99f86;
}

select option {
    color: var(--text);
    background: var(--surface);
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

button {
    display: inline-flex;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    color: var(--ink);
    background: var(--gold);
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-align: center;
    cursor: pointer;
    transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
}

button:hover:not(:disabled) {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
}

button:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow: none;
}

button:disabled {
    opacity: 0.65;
    cursor: wait;
}

.button-full {
    width: 100%;
}

.button-secondary {
    color: var(--ink);
    background: var(--text);
}

.button-danger {
    color: var(--text);
    background: var(--red);
}

.button-danger:hover:not(:disabled) {
    background: var(--red-hover);
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible,
button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
}

/* ---------- Meldungen ---------- */

.status {
    margin: 16px 0 0;
    padding: 12px 14px;
    color: var(--text);
    background: var(--surface-2);
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    font-size: 0.9rem;
    overflow-wrap: anywhere;
}

.status.success {
    border-left: 6px solid var(--gold);
}

.status.error {
    color: var(--red-text);
    background: var(--burgundy);
}

/* ---------- Liste ---------- */

.list-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
    margin-bottom: 16px;
}

.list-head h2 {
    margin: 0;
}

.list-head span {
    color: var(--muted);
    font-size: 0.85rem;
}

.gift-list {
    display: grid;
    gap: 18px;
}

.gift-item {
    display: grid;
    grid-template-columns: 84px minmax(0, 1fr);
    gap: 14px 18px;
    align-items: start;
    padding: 16px;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow:
        var(--shadow),
        0 0 0 var(--bw) rgba(241, 226, 184, 0.28);
}

.gift-item.is-top {
    background: var(--burgundy);
    box-shadow:
        var(--shadow),
        0 0 0 var(--bw) var(--gold);
}

.gift-image {
    display: block;
    width: 84px;
    height: 84px;
    padding: 5px;
    object-fit: contain;
    background: #fff;
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
}

.gift-info {
    min-width: 0;
}

.gift-title {
    margin: 0 0 5px;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: normal;
    text-transform: none;
    overflow-wrap: anywhere;
}

.gift-price {
    margin: 0;
    color: var(--gold);
    font-weight: 800;
}

.gift-note {
    margin: 9px 0 0;
    padding-left: 10px;
    color: var(--muted);
    border-left: 3px solid var(--gold);
    font-size: 0.88rem;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

.priority-field {
    display: block;
    max-width: 260px;
    margin-top: 14px;
}

.priority-field .field-label {
    font-size: 0.76rem;
}

.priority-field select {
    min-height: 42px;
    padding: 7px 10px;
    font-size: 0.86rem;
}

.item-actions {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* ---------- Bearbeitungsformular ---------- */

.edit-form {
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 18px;
    background: var(--bg);
    border: var(--bw) solid var(--ink);
    border-top: 4px solid var(--gold);
    border-radius: 4px;
}

.edit-form h3 {
    margin: 0 0 16px;
    color: var(--gold);
    font-size: 0.83rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.edit-form input,
.edit-form select,
.edit-form textarea {
    background: var(--surface);
}

.edit-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

.empty-state {
    margin: 0;
    padding: 26px;
    color: var(--muted);
    background: var(--surface);
    border: var(--bw) dashed var(--border);
    border-radius: 6px;
    text-align: center;
}

.logout-button {
    width: 100%;
    margin-top: 30px;
}

/* ---------- Mobil ---------- */

@media (max-width: 560px) {
    :root {
        --bw: 2px;
        --shadow: 4px 4px 0 var(--ink);
        --shadow-sm: 2px 2px 0 var(--ink);
    }

    body {
        padding: 18px 14px 32px;
    }

    .admin-header {
        padding: 18px;
    }

    .panel {
        padding: 16px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .gift-item {
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 12px 14px;
        padding: 12px;
    }

    .gift-image {
        width: 64px;
        height: 64px;
    }

    .gift-title {
        font-size: 1rem;
    }

    .gift-note {
        font-size: 0.84rem;
    }

    .edit-form {
        padding: 14px;
    }

    button {
        padding: 10px;
        font-size: 0.82rem;
    }
}

@media (max-width: 360px) {
    .item-actions,
    .edit-buttons {
        grid-template-columns: 1fr;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>
<main class="admin-page">
    <header class="admin-header">
        <p class="eyebrow">Verwaltung</p>
        <h1>Meine Weihnachtswünsche</h1>
        <p class="intro">
            Wünsche hinzufügen, bearbeiten und mit Notizen ergänzen.
            Reservierungen werden hier nicht angezeigt.
        </p>
    </header>

    <noscript>
        <p class="status error">
            Bitte aktiviere JavaScript, um den Admin-Bereich zu verwenden.
        </p>
    </noscript>

    <p
        id="appStatus"
        class="status"
        role="status"
        aria-live="polite"
    >
        Anmeldung wird geprüft …
    </p>

    <section id="loginSection" class="panel login-panel" hidden>
        <h2>Anmelden</h2>

        <form id="loginForm">
            <label class="field" for="email">
                <span class="field-label">E-Mail</span>
                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >
            </label>

            <label class="field" for="password">
                <span class="field-label">Passwort</span>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button
                id="loginButton"
                class="button-full"
                type="submit"
            >
                Anmelden
            </button>

            <p
                id="loginStatus"
                class="status"
                role="status"
                aria-live="polite"
                hidden
            ></p>
        </form>
    </section>

    <section id="adminSection" hidden>
        <section class="panel">
            <h2>Neuen Wunsch hinzufügen</h2>

            <form id="newGiftForm">
                <label class="field" for="giftName">
                    <span class="field-label">Titel</span>
                    <input
                        id="giftName"
                        type="text"
                        maxlength="120"
                        placeholder="Zum Beispiel: Bluetooth-Kopfhörer"
                        required
                    >
                </label>

                <div class="form-row">
                    <label class="field" for="giftPrice">
                        <span class="field-label">Preis</span>
                        <input
                            id="giftPrice"
                            type="text"
                            maxlength="30"
                            placeholder="Zum Beispiel: 49,99 €"
                        >
                    </label>

                    <label class="field" for="giftPriority">
                        <span class="field-label">Priorität</span>
                        <select id="giftPriority">
                            <option value="3">★★★ Top-Wunsch</option>
                            <option value="2" selected>★★☆ Gern</option>
                            <option value="1">★☆☆ Nice to have</option>
                        </select>
                    </label>
                </div>

                <label class="field" for="giftImage">
                    <span class="field-label">Bild-URL</span>
                    <input
                        id="giftImage"
                        type="url"
                        placeholder="https://…"
                    >
                </label>

                <label class="field" for="giftLink">
                    <span class="field-label">Produktlink</span>
                    <input
                        id="giftLink"
                        type="url"
                        placeholder="https://…"
                    >
                </label>

                <label class="field" for="giftNote">
                    <span class="field-label">
                        Notiz – für Besucher sichtbar
                    </span>
                    <textarea
                        id="giftNote"
                        maxlength="300"
                        placeholder="Zum Beispiel: Größe M, bitte in Schwarz"
                    ></textarea>
                </label>

                <button
                    id="saveButton"
                    class="button-full"
                    type="submit"
                >
                    Wunsch speichern
                </button>

                <p
                    id="saveStatus"
                    class="status"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>
            </form>
        </section>

        <div class="list-head">
            <h2>Vorhandene Wünsche</h2>
            <span id="giftCount"></span>
        </div>

        <div
            id="giftList"
            class="gift-list"
            aria-label="Wünsche verwalten"
        ></div>

        <button
            id="logoutButton"
            class="button-secondary logout-button"
            type="button"
        >
            Abmelden
        </button>
    </section>
</main>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAlmVEiqvYL8FaDj1J14tpq-Mg8zOxAy6U",
    authDomain: "weihnachtsliste-241226.firebaseapp.com",
    projectId: "weihnachtsliste-241226",
    storageBucket: "weihnachtsliste-241226.firebasestorage.app",
    messagingSenderId: "243572027003",
    appId: "1:243572027003:web:2b9ca250ff47c50cd07cde"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "lutzberan98@gmail.com";
const NOTE_MAX = 300;

const PRIORITIES = [
    { value: 3, label: "★★★ Top-Wunsch" },
    { value: 2, label: "★★☆ Gern" },
    { value: 1, label: "★☆☆ Nice to have" }
];

const appStatus = document.getElementById("appStatus");
const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginStatus = document.getElementById("loginStatus");
const logoutButton = document.getElementById("logoutButton");

const newGiftForm = document.getElementById("newGiftForm");
const saveButton = document.getElementById("saveButton");
const saveStatus = document.getElementById("saveStatus");

const nameInput = document.getElementById("giftName");
const priceInput = document.getElementById("giftPrice");
const priorityInput = document.getElementById("giftPriority");
const imageInput = document.getElementById("giftImage");
const linkInput = document.getElementById("giftLink");
const noteInput = document.getElementById("giftNote");

const giftList = document.getElementById("giftList");
const giftCount = document.getElementById("giftCount");

let loadVersion = 0;

function isAdmin(user = auth.currentUser) {
    return Boolean(
        user &&
        typeof user.email === "string" &&
        user.email.toLowerCase() === ADMIN_EMAIL
    );
}

onAuthStateChanged(auth, (user) => {
    const allowed = isAdmin(user);

    appStatus.hidden = true;
    loginSection.hidden = allowed;
    adminSection.hidden = !allowed;

    if (allowed) {
        loginStatus.hidden = true;
        document.getElementById("password").value = "";
        loadGifts();
        return;
    }

    loadVersion++;
    giftList.replaceChildren();
    giftCount.textContent = "";

    if (user) {
        showStatus(
            loginStatus,
            "Dieses Konto ist nicht für den Admin-Bereich freigeschaltet.",
            "error"
        );
    }
});

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    setBusy(loginButton, "Anmeldung …");
    loginStatus.hidden = true;

    try {
        await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
        );
    } catch (error) {
        console.error("Anmeldung fehlgeschlagen:", error);

        showStatus(
            loginStatus,
            "Anmeldung fehlgeschlagen. Bitte prüfe E-Mail und Passwort.",
            "error"
        );
    } finally {
        resetButton(loginButton, "Anmelden");
    }
});

logoutButton.addEventListener("click", async () => {
    setBusy(logoutButton, "Abmeldung …");

    try {
        await signOut(auth);
    } catch (error) {
        console.error("Abmeldung fehlgeschlagen:", error);
        alert("Abmelden hat nicht funktioniert. Bitte erneut versuchen.");
    } finally {
        resetButton(logoutButton, "Abmelden");
    }
});

newGiftForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!isAdmin()) return;

    const data = {
        name: nameInput.value.trim(),
        price: priceInput.value.trim(),
        priority: Number(priorityInput.value),
        image: imageInput.value.trim(),
        link: linkInput.value.trim(),
        note: noteInput.value.trim()
    };

    const validationError = validateGift(data);

    if (validationError) {
        showStatus(saveStatus, validationError, "error");
        return;
    }

    setBusy(saveButton, "Wird gespeichert …");
    saveStatus.hidden = true;

    try {
        await addDoc(collection(db, "gifts"), {
            ...data,
            reserved: false,
            reservedBy: "",
            reservedAt: null,
            createdAt: serverTimestamp()
        });

        newGiftForm.reset();

        showStatus(
            saveStatus,
            "Wunsch wurde gespeichert.",
            "success"
        );

        await loadGifts();
    } catch (error) {
        console.error("Speichern fehlgeschlagen:", error);

        showStatus(
            saveStatus,
            "Speichern fehlgeschlagen. Bitte prüfe Verbindung und Firestore-Berechtigungen.",
            "error"
        );
    } finally {
        resetButton(saveButton, "Wunsch speichern");
    }
});

async function loadGifts() {
    if (!isAdmin()) return;

    const currentVersion = ++loadVersion;
    showListMessage("Wünsche werden geladen …");

    try {
        const snapshot = await getDocs(
            query(
                collection(db, "gifts"),
                orderBy("createdAt", "desc")
            )
        );

        if (currentVersion !== loadVersion || !isAdmin()) {
            return;
        }

        // Nur die für die Verwaltung benötigten Felder übernehmen.
        // Reservierungsdaten werden weder angezeigt noch ausgewertet.
        const gifts = snapshot.docs.map((giftDoc) => {
            const data = giftDoc.data();

            return {
                id: giftDoc.id,
                name: asText(data.name),
                price: asText(data.price),
                image: asText(data.image),
                link: asText(data.link),
                note: asText(data.note),
                priority: normalizePriority(data.priority)
            };
        });

        // Bei gleicher Priorität bleibt "neueste zuerst" erhalten.
        gifts.sort((a, b) => b.priority - a.priority);

        giftCount.textContent =
            `${gifts.length} ${gifts.length === 1 ? "Wunsch" : "Wünsche"}`;

        if (gifts.length === 0) {
            showListMessage("Es sind noch keine Wünsche vorhanden.");
            return;
        }

        const fragment = document.createDocumentFragment();

        gifts.forEach((gift) => {
            fragment.appendChild(createGiftItem(gift));
        });

        giftList.replaceChildren(fragment);
    } catch (error) {
        if (currentVersion !== loadVersion || !isAdmin()) {
            return;
        }

        console.error("Laden fehlgeschlagen:", error);
        giftCount.textContent = "";

        showListMessage(
            "Wünsche konnten nicht geladen werden. Bitte prüfe Verbindung und Firestore-Berechtigungen."
        );
    }
}

function createGiftItem(gift) {
    const item = document.createElement("article");

    item.className =
        "gift-item" + (gift.priority === 3 ? " is-top" : "");

    item.innerHTML = `
        <img class="gift-image" alt="" loading="lazy">

        <div class="gift-info">
            <h2 class="gift-title"></h2>
            <p class="gift-price"></p>
            <p class="gift-note" hidden></p>

            <label class="priority-field">
                <span class="field-label">Priorität ändern</span>
                <select class="quick-priority">
                    ${priorityOptionsHtml(gift.priority)}
                </select>
            </label>
        </div>

        <div class="item-actions">
            <button
                class="edit-button"
                type="button"
                aria-expanded="false"
            >
                Bearbeiten
            </button>

            <button
                class="button-danger delete-button"
                type="button"
            >
                Löschen
            </button>
        </div>

        <form class="edit-form" hidden>
            <h3>Wunsch bearbeiten</h3>

            <label class="field">
                <span class="field-label">Titel</span>
                <input
                    class="edit-name"
                    type="text"
                    maxlength="120"
                    required
                >
            </label>

            <div class="form-row">
                <label class="field">
                    <span class="field-label">Preis</span>
                    <input
                        class="edit-price"
                        type="text"
                        maxlength="30"
                    >
                </label>

                <label class="field">
                    <span class="field-label">Priorität</span>
                    <select class="edit-priority">
                        ${priorityOptionsHtml(gift.priority)}
                    </select>
                </label>
            </div>

            <label class="field">
                <span class="field-label">Bild-URL</span>
                <input
                    class="edit-image"
                    type="url"
                    placeholder="https://…"
                >
            </label>

            <label class="field">
                <span class="field-label">Produktlink</span>
                <input
                    class="edit-link"
                    type="url"
                    placeholder="https://…"
                >
            </label>

            <label class="field">
                <span class="field-label">
                    Notiz – für Besucher sichtbar
                </span>
                <textarea
                    class="edit-note"
                    maxlength="${NOTE_MAX}"
                ></textarea>
            </label>

            <p
                class="status edit-status"
                role="status"
                aria-live="polite"
                hidden
            ></p>

            <div class="edit-buttons">
                <button type="submit">Speichern</button>
                <button
                    class="button-secondary cancel-edit"
                    type="button"
                >
                    Abbrechen
                </button>
            </div>
        </form>
    `;

    item.querySelector(".gift-title").textContent =
        gift.name || "Ohne Titel";

    item.querySelector(".gift-price").textContent =
        gift.price || "Preis offen";

    const note = item.querySelector(".gift-note");
    note.textContent = gift.note;
    note.hidden = !gift.note;

    const image = item.querySelector(".gift-image");

    image.addEventListener("error", () => {
        image.src = createFallbackImage();
    }, { once: true });

    image.src = safeUrl(gift.image) || createFallbackImage();

    const form = item.querySelector(".edit-form");
    const editButton = item.querySelector(".edit-button");
    const quickPriority = item.querySelector(".quick-priority");
    const editStatus = form.querySelector(".edit-status");

    const editName = form.querySelector(".edit-name");
    const editPrice = form.querySelector(".edit-price");
    const editPriority = form.querySelector(".edit-priority");
    const editImage = form.querySelector(".edit-image");
    const editLink = form.querySelector(".edit-link");
    const editNote = form.querySelector(".edit-note");

    function resetEditFields() {
        editName.value = gift.name;
        editPrice.value = gift.price;
        editPriority.value = String(gift.priority);
        editImage.value = gift.image;
        editLink.value = gift.link;
        editNote.value = gift.note;
        editStatus.hidden = true;
    }

    function closeEditor() {
        form.hidden = true;
        quickPriority.disabled = false;
        editButton.setAttribute("aria-expanded", "false");
        editButton.focus();
    }

    resetEditFields();

    editButton.addEventListener("click", () => {
        if (!form.hidden) {
            closeEditor();
            return;
        }

        resetEditFields();
        form.hidden = false;
        quickPriority.disabled = true;
        editButton.setAttribute("aria-expanded", "true");
        editName.focus();
    });

    form.querySelector(".cancel-edit")
        .addEventListener("click", closeEditor);

    quickPriority.addEventListener("change", async () => {
        if (!isAdmin()) return;

        const nextPriority = normalizePriority(quickPriority.value);

        quickPriority.disabled = true;
        editButton.disabled = true;

        try {
            await updateDoc(doc(db, "gifts", gift.id), {
                priority: nextPriority
            });

            await loadGifts();
        } catch (error) {
            console.error("Priorität konnte nicht geändert werden:", error);

            quickPriority.value = String(gift.priority);
            quickPriority.disabled = false;
            editButton.disabled = false;

            alert("Die Priorität konnte nicht gespeichert werden.");
        }
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!isAdmin()) return;

        const data = {
            name: editName.value.trim(),
            price: editPrice.value.trim(),
            priority: Number(editPriority.value),
            image: editImage.value.trim(),
            link: editLink.value.trim(),
            note: editNote.value.trim()
        };

        const validationError = validateGift(data);

        if (validationError) {
            showStatus(editStatus, validationError, "error");
            return;
        }

        const submitButton =
            form.querySelector('button[type="submit"]');

        setBusy(submitButton, "Wird gespeichert …");

        const controls = [...form.elements];
        controls.forEach((control) => {
            control.disabled = true;
        });

        editButton.disabled = true;

        try {
            // Bestehende Reservierungsfelder bleiben unverändert.
            await updateDoc(doc(db, "gifts", gift.id), data);
            await loadGifts();
        } catch (error) {
            console.error("Bearbeiten fehlgeschlagen:", error);

            controls.forEach((control) => {
                control.disabled = false;
            });

            editButton.disabled = false;
            resetButton(submitButton, "Speichern");

            showStatus(
                editStatus,
                "Änderungen konnten nicht gespeichert werden. Bitte erneut versuchen.",
                "error"
            );
        }
    });

    const deleteButton = item.querySelector(".delete-button");

    deleteButton.addEventListener("click", async () => {
        if (!isAdmin()) return;

        const confirmed = confirm(
            `„${gift.name || "Diesen Wunsch"}“ wirklich löschen? ` +
            "Dieser Schritt kann nicht rückgängig gemacht werden."
        );

        if (!confirmed) return;

        setBusy(deleteButton, "Wird gelöscht …");

        try {
            await deleteDoc(doc(db, "gifts", gift.id));
            await loadGifts();
        } catch (error) {
            console.error("Löschen fehlgeschlagen:", error);
            resetButton(deleteButton, "Löschen");

            alert("Der Wunsch konnte nicht gelöscht werden.");
        }
    });

    return item;
}

function validateGift(data) {
    if (!data.name || data.name.length > 120) {
        return "Bitte gib einen Titel mit höchstens 120 Zeichen ein.";
    }

    if (data.price.length > 30) {
        return "Der Preis darf höchstens 30 Zeichen enthalten.";
    }

    if (![1, 2, 3].includes(data.priority)) {
        return "Bitte wähle eine gültige Priorität.";
    }

    if (data.image && !safeUrl(data.image)) {
        return "Die Bild-URL muss eine gültige HTTP- oder HTTPS-Adresse sein.";
    }

    if (data.link && !safeUrl(data.link)) {
        return "Der Produktlink muss eine gültige HTTP- oder HTTPS-Adresse sein.";
    }

    if (data.note.length > NOTE_MAX) {
        return `Die Notiz darf höchstens ${NOTE_MAX} Zeichen enthalten.`;
    }

    return "";
}

function normalizePriority(value) {
    const number = Number(value);
    return [1, 2, 3].includes(number) ? number : 2;
}

function priorityOptionsHtml(selected) {
    return PRIORITIES.map((option) => `
        <option
            value="${option.value}"
            ${option.value === selected ? "selected" : ""}
        >${option.label}</option>
    `).join("");
}

function asText(value) {
    return typeof value === "string" ? value.trim() : "";
}

function safeUrl(value) {
    if (typeof value !== "string" || !value.trim()) {
        return "";
    }

    try {
        const url = new URL(value.trim());

        return ["http:", "https:"].includes(url.protocol)
            ? url.href
            : "";
    } catch {
        return "";
    }
}

function showStatus(element, text, type = "") {
    element.textContent = text;
    element.className = "status" + (type ? ` ${type}` : "");
    element.hidden = false;
}

function showListMessage(text) {
    const message = document.createElement("p");
    message.className = "empty-state";
    message.textContent = text;

    giftList.replaceChildren(message);
}

function setBusy(button, text) {
    button.disabled = true;
    button.textContent = text;
}

function resetButton(button, text) {
    button.disabled = false;
    button.textContent = text;
}

function createFallbackImage() {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
            <rect width="160" height="160" fill="#234233"/>
            <text
                x="80"
                y="86"
                text-anchor="middle"
                font-family="Arial, sans-serif"
                font-size="18"
                fill="#d3c6a3"
            >Kein Bild</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}
</script>
</body>
</html>
