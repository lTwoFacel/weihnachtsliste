<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#081526">
<title>Admin – Weihnachtswunschliste</title>

<style>
:root {
    color-scheme: dark;
    --bg: #081526;
    --bg2: #0d2542;
    --glass: rgba(173, 216, 255, .14);
    --line: rgba(220, 240, 255, .42);
    --line-soft: rgba(220, 240, 255, .20);
    --text: #f3faff;
    --muted: rgba(243, 250, 255, .74);
    --blue: #3d8eeb;
    --blue-light: #8fd7ff;
    --green: #7ee0a3;
    --red: #ff8d8d;
}

* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 24px 14px;
    color: var(--text);
    background:
        radial-gradient(circle at 18% 12%, #1b4b7a 0, transparent 42%),
        radial-gradient(circle at 82% 8%, #0f3560 0, transparent 46%),
        linear-gradient(180deg, var(--bg2), var(--bg) 70%, #05101d);
    font-family: "Segoe UI", Tahoma, Verdana, Arial, sans-serif;
}

.admin-card {
    width: min(760px, 100%);
    margin: auto;
    padding: 24px;
    background: linear-gradient(180deg, rgba(173, 216, 255, .24), rgba(13, 42, 74, .78));
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .12) inset,
        0 20px 50px rgba(0, 0, 0, .5),
        0 0 26px rgba(61, 142, 235, .22);
    backdrop-filter: blur(16px);
}

h1 {
    margin: 0 0 6px;
    color: #fff;
    font: 700 clamp(1.5rem, 5vw, 2.1rem) / 1.2 "Segoe UI", Tahoma, sans-serif;
    text-shadow:
        0 0 12px rgba(143, 215, 255, .5),
        0 2px 4px rgba(0, 0, 0, .7);
}

h2 {
    margin: 24px 0 10px;
    color: #fff;
}

p {
    color: var(--muted);
    line-height: 1.6;
}

label {
    display: block;
    margin: 14px 0 6px;
    color: var(--muted);
    font-size: .9rem;
}

input,
textarea {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    color: var(--text);
    background: rgba(5, 16, 29, .72);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset;
}

input:focus,
textarea:focus {
    outline: 2px solid var(--blue-light);
    outline-offset: 1px;
}

button {
    width: 100%;
    min-height: 48px;
    margin-top: 16px;
    padding: 11px 16px;
    color: #04121f;
    background: linear-gradient(180deg, #a8e0ff, #3d8eeb 52%, #1c5f9e);
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 6px;
    font: 700 1rem "Segoe UI", Tahoma, sans-serif;
    cursor: pointer;
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .18) inset,
        0 4px 12px rgba(0, 0, 0, .38);
    text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
}

button:hover {
    background: linear-gradient(180deg, #c6ecff, #54a4f0 52%, #2a76bb);
    box-shadow:
        0 0 0 1px rgba(255, 255, 255, .28) inset,
        0 0 18px rgba(143, 215, 255, .45);
}

button:disabled {
    opacity: .65;
    cursor: wait;
}

.status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
    background: var(--glass);
    border: 1px solid var(--line-soft);
    color: var(--muted);
}

.status.success {
    color: #dfffe9;
    background: linear-gradient(180deg, rgba(126, 224, 163, .22), rgba(16, 54, 36, .75));
    border-color: rgba(126, 224, 163, .55);
}

.status.error {
    color: #ffd6d6;
    background: linear-gradient(180deg, rgba(255, 120, 120, .18), rgba(70, 20, 20, .75));
    border-color: rgba(255, 120, 120, .55);
}

.hidden {
    display: none;
}

.gift-list {
    margin-top: 20px;
    display: grid;
    gap: 10px;
}

.gift-item {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px;
    background: rgba(5, 16, 29, .5);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
}

.gift-item img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 6px;
    background: #05101d;
}

.gift-item strong {
    display: block;
    color: #fff;
}

.gift-item small {
    color: var(--muted);
}

.gift-item button {
    width: auto;
    min-height: 38px;
    margin: 0;
    padding: 8px 12px;
    font-size: .82rem;
    color: #fff;
    background: linear-gradient(180deg, #ff9d9d, #c83737 52%, #8d1f1f);
    border-color: rgba(255, 190, 190, .7);
}

@media (max-width: 560px) {
    body {
        padding: 12px 8px;
    }

    .admin-card {
        padding: 16px;
    }

    .gift-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>
<main class="admin-card">
    <h1>🎁 Admin-Bereich</h1>
    <p>
        Melde dich mit deiner Admin-E-Mail an, um Wünsche hinzuzufügen
        oder zu entfernen.
    </p>

    <section id="loginSection">
        <label for="email">E-Mail</label>
        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="lutzberan98@gmail.com"
        >

        <label for="password">Passwort</label>
        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Dein Passwort"
        >

        <button id="loginButton" type="button">Anmelden</button>
    </section>

    <section id="adminSection" class="hidden">
        <h2>Neuen Wunsch hinzufügen</h2>

        <label for="giftName">Titel</label>
        <input
            id="giftName"
            type="text"
            maxlength="120"
            placeholder="Zum Beispiel: Bluetooth-Kopfhörer"
        >

        <label for="giftPrice">Preis</label>
        <input
            id="giftPrice"
            type="text"
            maxlength="30"
            placeholder="Zum Beispiel: 49,99 €"
        >

        <label for="giftImage">Bild-URL</label>
        <input
            id="giftImage"
            type="url"
            placeholder="https://…"
        >

        <label for="giftLink">Produktlink</label>
        <input
            id="giftLink"
            type="url"
            placeholder="https://…"
        >

        <button id="saveButton" type="button">Wunsch speichern</button>

        <p class="status" id="status">Bereit.</p>

        <h2>Vorhandene Wünsche</h2>
        <div class="gift-list" id="giftList"></div>

        <button id="logoutButton" type="button">Abmelden</button>
    </section>
</main>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAlmVEiqvYL8FaDj1J14tpq-Mg8zOxAy6U",
    authDomain: "weihnachtsliste-241226.firebaseapp.com",
    projectId: "weihnachtsliste-241226",
    storageBucket: "weihnachtsliste-241226.firebasestorage.app",
    messagingSenderId: "243572027003",
    appId: "1:243572027003:web:2b9ca250ff47c50cd07cde"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const nameInput = document.getElementById("giftName");
const priceInput = document.getElementById("giftPrice");
const imageInput = document.getElementById("giftImage");
const linkInput = document.getElementById("giftLink");
const saveButton = document.getElementById("saveButton");
const status = document.getElementById("status");
const giftList = document.getElementById("giftList");

const ADMIN_EMAIL = "lutzberan98@gmail.com";

onAuthStateChanged(auth, (user) => {
    if (
        user &&
        user.email &&
        user.email.toLowerCase() === ADMIN_EMAIL
    ) {
        loginSection.classList.add("hidden");
        adminSection.classList.remove("hidden");
        loadGifts();
    } else {
        loginSection.classList.remove("hidden");
        adminSection.classList.add("hidden");
        giftList.innerHTML = "";
    }
});

loginButton.addEventListener("click", async () => {
    setBusy(loginButton, "Anmeldung …");

    try {
        await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
        );

        setStatus("Angemeldet.", "success");
    } catch (error) {
        console.error(error);
        setStatus(
            "Anmeldung fehlgeschlagen. Prüfe E-Mail, Passwort und Firebase Authentication.",
            "error"
        );
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Anmelden";
    }
});

logoutButton.addEventListener("click", async () => {
    await signOut(auth);
    setStatus("Abgemeldet.");
});

saveButton.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const price = priceInput.value.trim();
    const image = imageInput.value.trim();
    const link = linkInput.value.trim();

    if (!name) {
        setStatus("Bitte gib einen Titel ein.", "error");
        return;
    }

    if (image && !isValidUrl(image)) {
        setStatus(
            "Die Bild-URL muss mit http:// oder https:// beginnen.",
            "error"
        );
        return;
    }

    if (link && !isValidUrl(link)) {
        setStatus(
            "Der Produktlink muss mit http:// oder https:// beginnen.",
            "error"
        );
        return;
    }

    setBusy(saveButton, "Wird gespeichert …");

    try {
        await addDoc(collection(db, "gifts"), {
            name,
            price,
            image,
            link,
            reserved: false,
            reservedBy: "",
            reservedAt: null,
            createdAt: serverTimestamp()
        });

        nameInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        linkInput.value = "";

        setStatus("Wunsch wurde gespeichert.", "success");
        await loadGifts();
    } catch (error) {
        console.error(error);
        setStatus(
            "Speichern fehlgeschlagen. Prüfe, ob deine Firestore-Regeln create für den Admin erlauben.",
            "error"
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Wunsch speichern";
    }
});

async function loadGifts() {
    giftList.innerHTML = "";

    try {
        const snapshot = await getDocs(
            query(
                collection(db, "gifts"),
                orderBy("createdAt", "desc")
            )
        );

        if (snapshot.empty) {
            giftList.innerHTML =
                "<p>Es sind noch keine Wünsche vorhanden.</p>";
            return;
        }

        snapshot.forEach((giftDoc) => {
            const gift = giftDoc.data();
            const id = giftDoc.id;

            const item = document.createElement("article");
            item.className = "gift-item";

            item.innerHTML = `
                <img
                    src="${escapeHtml(gift.image || createFallbackImage())}"
                    alt=""
                    onerror="this.src='${createFallbackImage()}';"
                >
                <div>
                    <strong>${escapeHtml(gift.name || "Ohne Titel")}</strong>
                    <small>${escapeHtml(gift.price || "Kein Preis")}</small>
                </div>
            `;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Löschen";

            deleteButton.addEventListener("click", async () => {
                if (!confirm("Diesen Wunsch wirklich löschen?")) return;

                deleteButton.disabled = true;

                try {
                    await deleteDoc(doc(db, "gifts", id));
                    await loadGifts();
                } catch (error) {
                    console.error(error);
                    alert(
                        "Löschen fehlgeschlagen. Prüfe die Firestore-Regeln."
                    );
                    deleteButton.disabled = false;
                }
            });

            item.appendChild(deleteButton);
            giftList.appendChild(item);
        });
    } catch (error) {
        console.error(error);
        giftList.innerHTML =
            "<p>Wünsche konnten nicht geladen werden. Prüfe die Firestore-Regeln.</p>";
    }
}

function setBusy(button, text) {
    button.disabled = true;
    button.textContent = text;
}

function setStatus(text, type = "") {
    status.textContent = text;
    status.className = "status " + type;
}

function isValidUrl(value) {
    try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol);
    } catch {
        return false;
    }
}

function escapeHtml(value = "") {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function createFallbackImage() {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
            <rect width="100%" height="100%" fill="#081526"/>
            <text x="60" y="68" text-anchor="middle"
                  font-family="Segoe UI, Arial" font-size="42"
                  fill="#8fd7ff">🎁</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
</script>
</body>
</html>
