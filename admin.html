<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120e1c">
<title>Admin – Weihnachtswunschliste</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>
:root {
    color-scheme: dark;

    --bg: #120e1c;
    --surface: #1b1528;
    --surface-2: #261c36;
    --line: #3b2e50;
    --line-strong: #5a4776;

    --text: #fff3d1;
    --muted: #cfc2ab;

    --orange: #e38a32;
    --orange-hover: #f09a4a;
    --orange-text: #1b101c;
    --gold: #f4b541;
    --green: #b4d091;
    --green-bg: #1f2e22;
    --red: #ff9b9b;
    --red-bg: #4a1d28;
    --red-text: #ffd9d3;
}

* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px 40px;
    color: var(--text);
    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(244, 181, 65, 0.10) 0,
            transparent 38%
        ),
        var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Tahoma, Verdana, Arial, sans-serif;
    line-height: 1.5;
}

.admin-card {
    width: min(800px, 100%);
    margin: 0 auto;
}

/* ---------- Kopf ---------- */
.admin-header {
    margin-bottom: 28px;
    padding: 4px 0 20px 20px;
    border-left: 4px solid var(--orange);
    border-bottom: 1px solid var(--line);
}

.eyebrow {
    margin: 0 0 4px;
    color: var(--orange);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

h1 {
    margin: 0;
    color: var(--text);
    font-family: "Mountains of Christmas", Georgia, serif;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 700;
    line-height: 1.04;
}

.intro {
    max-width: 560px;
    margin: 10px 0 0;
    color: var(--muted);
}

h2 {
    margin: 0 0 14px;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

/* ---------- Formulare ---------- */
.panel {
    margin-bottom: 28px;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
}

label {
    display: block;
    margin: 14px 0 6px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
}

.panel > label:first-of-type,
.edit-form > label:first-of-type {
    margin-top: 0;
}

input,
select,
textarea {
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    font: inherit;
    font-size: 1rem;
}

textarea {
    min-height: 88px;
    resize: vertical;
    line-height: 1.45;
}

select option {
    color: var(--text);
    background: var(--surface);
}

input::placeholder,
textarea::placeholder {
    color: #8c7f99;
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible,
button:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.char-hint {
    margin: 4px 0 0;
    color: #a99c88;
    font-size: 0.78rem;
    text-align: right;
}

button {
    width: 100%;
    min-height: 46px;
    margin-top: 18px;
    padding: 10px 16px;
    color: var(--orange-text);
    background: var(--orange);
    border: 1px solid var(--orange);
    border-radius: 4px;
    font: 600 0.95rem "Segoe UI", system-ui, -apple-system, Tahoma, Verdana, Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
}

button:hover:not(:disabled) {
    background: var(--orange-hover);
}

button:disabled {
    color: var(--muted);
    background: var(--surface-2);
    border-color: var(--line);
    cursor: wait;
}

.button-secondary {
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line-strong);
}

.button-secondary:hover:not(:disabled) {
    background: var(--surface-2);
    border-color: var(--muted);
}

.status {
    margin: 16px 0 0;
    padding: 11px 13px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--line-strong);
    border-radius: 4px;
    font-size: 0.92rem;
}

.status.success {
    color: var(--green);
    background: var(--green-bg);
    border-color: #44603f;
    border-left-color: var(--green);
}

.status.error {
    color: var(--red-text);
    background: var(--red-bg);
    border-color: #8a3a4a;
    border-left-color: var(--red);
}

.hidden {
    display: none !important;
}

/* ---------- Liste ---------- */
.list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
}

.list-head h2 {
    margin: 0;
}

.list-head span {
    color: var(--muted);
    font-size: 0.85rem;
}

.gift-list {
    display: grid;
    gap: 10px;
}

.gift-item {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    gap: 12px 16px;
    align-items: start;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
}

.gift-item.is-top {
    border-left: 4px solid var(--orange);
}

.gift-item img {
    width: 72px;
    height: 72px;
    padding: 4px;
    object-fit: contain;
    background: #fff;
    border-radius: 3px;
}

.gift-info {
    min-width: 0;
}

.gift-info strong {
    display: block;
    color: var(--text);
    font-size: 1.02rem;
    overflow-wrap: anywhere;
}

.gift-info .price {
    display: block;
    color: var(--gold);
    font-weight: 700;
}

.gift-info .note {
    margin: 8px 0 0;
    padding-left: 10px;
    color: var(--muted);
    border-left: 2px solid var(--line-strong);
    font-size: 0.88rem;
    line-height: 1.45;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

.tag {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 9px;
    border-radius: 3px;
    font-size: 0.8rem;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.tag-open {
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
}

.tag-reserved {
    color: var(--green);
    background: var(--green-bg);
    border: 1px solid #44603f;
}

.prio-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
}

.prio-row .stars {
    color: var(--gold);
    letter-spacing: 2px;
}

.prio-row select {
    width: auto;
    min-height: 38px;
    padding: 6px 10px;
    font-size: 0.88rem;
}

.item-actions {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
}

.item-actions button {
    min-height: 44px;
    margin: 0;
    padding: 8px 12px;
    font-size: 0.88rem;
}

.item-actions .delete-button {
    color: var(--red);
    background: transparent;
    border: 1px solid var(--red);
}

.item-actions .delete-button:hover:not(:disabled) {
    background: var(--red-bg);
}

/* ---------- Bearbeiten-Formular ---------- */
.edit-form {
    grid-column: 1 / -1;
    margin-top: 2px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-top: 3px solid var(--orange);
    border-radius: 4px;
}

.edit-form h3 {
    margin: 0 0 12px;
    color: var(--orange);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.edit-form input,
.edit-form select,
.edit-form textarea {
    background: var(--surface);
}

.edit-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.edit-buttons button {
    margin-top: 16px;
}

.empty {
    padding: 24px;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--line-strong);
    border-radius: 4px;
    text-align: center;
}

.logout {
    margin-top: 28px;
}

@media (max-width: 560px) {
    body {
        padding: 16px 12px 28px;
    }

    .admin-header {
        padding-left: 14px;
        border-left-width: 3px;
    }

    .panel {
        padding: 16px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .gift-item {
        grid-template-columns: 60px minmax(0, 1fr);
        gap: 10px 12px;
        padding: 12px;
    }

    .gift-item img {
        width: 60px;
        height: 60px;
    }

    .item-actions {
        grid-template-columns: 1fr;
    }

    .edit-form {
        padding: 14px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>
<main class="admin-card">
    <header class="admin-header">
        <p class="eyebrow">Verwaltung</p>
        <h1>Admin-Bereich</h1>
        <p class="intro">
            Wünsche anlegen und bearbeiten, Notizen hinzufügen,
            Prioritäten setzen und Reservierungen verwalten.
        </p>
    </header>

    <section id="loginSection" class="panel">
        <h2>Anmelden</h2>

        <label for="email">E-Mail</label>
        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="lutzberan98@gmail.com"
        >

        <label for="password">Passwort</label>
        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Dein Passwort"
        >

        <button id="loginButton" type="button">Anmelden</button>
    </section>

    <section id="adminSection" class="hidden">
        <div class="panel">
            <h2>Neuen Wunsch hinzufügen</h2>

            <label for="giftName">Titel</label>
            <input
                id="giftName"
                type="text"
                maxlength="120"
                placeholder="Zum Beispiel: Bluetooth-Kopfhörer"
            >

            <div class="form-row">
                <div>
                    <label for="giftPrice">Preis</label>
                    <input
                        id="giftPrice"
                        type="text"
                        maxlength="30"
                        placeholder="Zum Beispiel: 49,99 €"
                    >
                </div>

                <div>
                    <label for="giftPriority">Priorität</label>
                    <select id="giftPriority">
                        <option value="3">★★★ Top-Wunsch</option>
                        <option value="2" selected>★★☆ Gern</option>
                        <option value="1">★☆☆ Nice to have</option>
                    </select>
                </div>
            </div>

            <label for="giftImage">Bild-URL</label>
            <input
                id="giftImage"
                type="url"
                placeholder="https://…"
            >

            <label for="giftLink">Produktlink</label>
            <input
                id="giftLink"
                type="url"
                placeholder="https://…"
            >

            <label for="giftNote">Notiz (für Besucher sichtbar)</label>
            <textarea
                id="giftNote"
                maxlength="300"
                placeholder="Zum Beispiel: Größe M, bitte in Schwarz"
            ></textarea>

            <button id="saveButton" type="button">Wunsch speichern</button>

            <p class="status" id="status" role="status" aria-live="polite">
                Bereit.
            </p>
        </div>

        <div class="list-head">
            <h2>Vorhandene Wünsche</h2>
            <span id="giftCount"></span>
        </div>

        <div class="gift-list" id="giftList"></div>

        <button
            id="logoutButton"
            class="button-secondary logout"
            type="button"
        >
            Abmelden
        </button>
    </section>
</main>

<script type="module">
import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAlmVEiqvYL8FaDj1J14tpq-Mg8zOxAy6U",
    authDomain: "weihnachtsliste-241226.firebaseapp.com",
    projectId: "weihnachtsliste-241226",
    storageBucket: "weihnachtsliste-241226.firebasestorage.app",
    messagingSenderId: "243572027003",
    appId: "1:243572027003:web:2b9ca250ff47c50cd07cde"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const nameInput = document.getElementById("giftName");
const priceInput = document.getElementById("giftPrice");
const priorityInput = document.getElementById("giftPriority");
const imageInput = document.getElementById("giftImage");
const linkInput = document.getElementById("giftLink");
const noteInput = document.getElementById("giftNote");
const saveButton = document.getElementById("saveButton");
const status = document.getElementById("status");
const giftList = document.getElementById("giftList");
const giftCount = document.getElementById("giftCount");

const ADMIN_EMAIL = "lutzberan98@gmail.com";
const NOTE_MAX = 300;

const PRIORITY_OPTIONS = [
    { value: 3, stars: "★★★", text: "Top-Wunsch" },
    { value: 2, stars: "★★☆", text: "Gern" },
    { value: 1, stars: "★☆☆", text: "Nice to have" }
];

onAuthStateChanged(auth, (user) => {
    if (
        user &&
        user.email &&
        user.email.toLowerCase() === ADMIN_EMAIL
    ) {
        loginSection.classList.add("hidden");
        adminSection.classList.remove("hidden");
        loadGifts();
    } else {
        loginSection.classList.remove("hidden");
        adminSection.classList.add("hidden");
        giftList.innerHTML = "";
        giftCount.textContent = "";
    }
});

loginButton.addEventListener("click", async () => {
    setBusy(loginButton, "Anmeldung …");

    try {
        await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
        );

        setStatus("Angemeldet.", "success");
    } catch (error) {
        console.error(error);
        alert(
            "Anmeldung fehlgeschlagen. Prüfe E-Mail, Passwort und Firebase Authentication."
        );
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Anmelden";
    }
});

logoutButton.addEventListener("click", async () => {
    await signOut(auth);
    setStatus("Abgemeldet.");
});

saveButton.addEventListener("click", async () => {
    const data = {
        name: nameInput.value.trim(),
        price: priceInput.value.trim(),
        image: imageInput.value.trim(),
        link: linkInput.value.trim(),
        note: noteInput.value.trim().slice(0, NOTE_MAX),
        priority: Number(priorityInput.value) || 2
    };

    const error = validateGift(data);

    if (error) {
        setStatus(error, "error");
        return;
    }

    setBusy(saveButton, "Wird gespeichert …");

    try {
        await addDoc(collection(db, "gifts"), {
            ...data,
            reserved: false,
            reservedBy: "",
            reservedAt: null,
            createdAt: serverTimestamp()
        });

        nameInput.value = "";
        priceInput.value = "";
        imageInput.value = "";
        linkInput.value = "";
        noteInput.value = "";
        priorityInput.value = "2";

        setStatus("Wunsch wurde gespeichert.", "success");
        await loadGifts();
    } catch (err) {
        console.error(err);
        setStatus(
            "Speichern fehlgeschlagen. Prüfe, ob deine Firestore-Regeln create für den Admin erlauben.",
            "error"
        );
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Wunsch speichern";
    }
});

function validateGift(data) {
    if (!data.name) {
        return "Bitte gib einen Titel ein.";
    }

    if (data.image && !isValidUrl(data.image)) {
        return "Die Bild-URL muss mit http:// oder https:// beginnen.";
    }

    if (data.link && !isValidUrl(data.link)) {
        return "Der Produktlink muss mit http:// oder https:// beginnen.";
    }

    return "";
}

async function loadGifts() {
    giftList.innerHTML = "";

    try {
        const snapshot = await getDocs(
            query(
                collection(db, "gifts"),
                orderBy("createdAt", "desc")
            )
        );

        if (snapshot.empty) {
            giftCount.textContent = "";
            giftList.innerHTML =
                '<p class="empty">Es sind noch keine Wünsche vorhanden.</p>';
            return;
        }

        const gifts = snapshot.docs.map((giftDoc) => ({
            id: giftDoc.id,
            ...giftDoc.data()
        }));

        // Gleiche Reihenfolge wie auf der Wunschliste:
        // offene zuerst, dann Priorität absteigend.
        gifts.sort((a, b) => {
            const reservedDiff =
                (a.reserved === true) - (b.reserved === true);

            if (reservedDiff !== 0) return reservedDiff;

            return getPriority(b) - getPriority(a);
        });

        const reservedCount = gifts.filter((g) => g.reserved === true).length;

        giftCount.textContent =
            `${gifts.length} gesamt · ${reservedCount} reserviert`;

        gifts.forEach((gift) => {
            giftList.appendChild(createGiftItem(gift));
        });
    } catch (error) {
        console.error(error);
        giftList.innerHTML =
            '<p class="empty">Wünsche konnten nicht geladen werden. Prüfe die Firestore-Regeln.</p>';
    }
}

function createGiftItem(gift) {
    const id = gift.id;
    const priority = getPriority(gift);
    const reserved = gift.reserved === true;
    const note = typeof gift.note === "string" ? gift.note.trim() : "";

    const item = document.createElement("article");
    item.className = "gift-item" +
        (priority === 3 && !reserved ? " is-top" : "");

    item.innerHTML = `
        <img
            src="${escapeHtml(gift.image || createFallbackImage())}"
            alt=""
            onerror="this.onerror=null; this.src='${createFallbackImage()}';"
        >

        <div class="gift-info">
            <strong>${escapeHtml(gift.name || "Ohne Titel")}</strong>
            <span class="price">${escapeHtml(gift.price || "Kein Preis")}</span>

            ${note ? `<p class="note">${escapeHtml(note)}</p>` : ""}

            ${
                reserved
                    ? `<span class="tag tag-reserved">
                           Reserviert von ${escapeHtml(gift.reservedBy || "unbekannt")}
                       </span>`
                    : `<span class="tag tag-open">Nicht reserviert</span>`
            }

            <div class="prio-row">
                <span class="stars" aria-hidden="true">
                    ${getPriorityStars(priority)}
                </span>

                <select class="quick-priority" aria-label="Priorität ändern">
                    ${priorityOptionsHtml(priority)}
                </select>
            </div>
        </div>

        <div class="item-actions"></div>

        <form class="edit-form hidden" novalidate>
            <h3>Wunsch bearbeiten</h3>

            <label>Titel
                <input class="edit-name" type="text" maxlength="120">
            </label>

            <div class="form-row">
                <label>Preis
                    <input class="edit-price" type="text" maxlength="30">
                </label>

                <label>Priorität
                    <select class="edit-priority">
                        ${priorityOptionsHtml(priority)}
                    </select>
                </label>
            </div>

            <label>Bild-URL
                <input class="edit-image" type="url" placeholder="https://…">
            </label>

            <label>Produktlink
                <input class="edit-link" type="url" placeholder="https://…">
            </label>

            <label>Notiz (für Besucher sichtbar)
                <textarea
                    class="edit-note"
                    maxlength="${NOTE_MAX}"
                    placeholder="Zum Beispiel: Größe M, bitte in Schwarz"
                ></textarea>
            </label>

            <p class="status edit-status hidden" role="status"></p>

            <div class="edit-buttons">
                <button type="submit">Speichern</button>
                <button type="button" class="button-secondary cancel-edit">
                    Abbrechen
                </button>
            </div>
        </form>
    `;

    // Werte per .value setzen (nicht per HTML), damit Sonderzeichen sicher bleiben.
    const form = item.querySelector(".edit-form");
    form.querySelector(".edit-name").value = gift.name || "";
    form.querySelector(".edit-price").value = gift.price || "";
    form.querySelector(".edit-image").value = gift.image || "";
    form.querySelector(".edit-link").value = gift.link || "";
    form.querySelector(".edit-note").value = note;

    // Schnelle Prioritätsänderung direkt in der Liste
    const quickPriority = item.querySelector(".quick-priority");

    quickPriority.addEventListener("change", async () => {
        const nextPriority = Number(quickPriority.value) || 2;

        quickPriority.disabled = true;

        try {
            await updateDoc(doc(db, "gifts", id), {
                priority: nextPriority
            });

            await loadGifts();
        } catch (error) {
            console.error(error);
            alert(
                "Priorität konnte nicht gespeichert werden. Prüfe die Firestore-Regeln."
            );
            quickPriority.value = String(priority);
            quickPriority.disabled = false;
        }
    });

    const actions = item.querySelector(".item-actions");

    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "Bearbeiten";

    editButton.addEventListener("click", () => {
        form.classList.toggle("hidden");

        if (!form.classList.contains("hidden")) {
            form.querySelector(".edit-name").focus();
        }
    });

    const reservationButton = document.createElement("button");
    reservationButton.type = "button";
    reservationButton.className = "button-secondary";
    reservationButton.textContent = reserved
        ? "Reservierung bearbeiten"
        : "Reservierung hinzufügen";

    reservationButton.addEventListener("click", async () => {
        const newName = prompt(
            "Name der Reservierung. Leer lassen, um die Reservierung freizugeben:",
            gift.reservedBy || ""
        );

        if (newName === null) return;

        const cleanedName = newName.trim().slice(0, 40);
        const nextReserved = Boolean(cleanedName);

        reservationButton.disabled = true;

        try {
            await updateDoc(doc(db, "gifts", id), {
                reserved: nextReserved,
                reservedBy: cleanedName,
                reservedAt: nextReserved ? serverTimestamp() : null
            });

            await loadGifts();
        } catch (error) {
            console.error(error);
            alert(
                "Reservierung konnte nicht gespeichert werden. Prüfe die Firestore-Regeln."
            );
            reservationButton.disabled = false;
        }
    });

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-button";
    deleteButton.textContent = "Löschen";

    deleteButton.addEventListener("click", async () => {
        if (!confirm("Diesen Wunsch wirklich löschen?")) return;

        deleteButton.disabled = true;

        try {
            await deleteDoc(doc(db, "gifts", id));
            await loadGifts();
        } catch (error) {
            console.error(error);
            alert("Löschen fehlgeschlagen. Prüfe die Firestore-Regeln.");
            deleteButton.disabled = false;
        }
    });

    actions.appendChild(editButton);
    actions.appendChild(reservationButton);
    actions.appendChild(deleteButton);

    // Bearbeiten: abbrechen
    form.querySelector(".cancel-edit").addEventListener("click", () => {
        form.classList.add("hidden");
    });

    // Bearbeiten: speichern
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const editStatus = form.querySelector(".edit-status");
        const submitButton = form.querySelector('button[type="submit"]');

        const data = {
            name: form.querySelector(".edit-name").value.trim(),
            price: form.querySelector(".edit-price").value.trim(),
            image: form.querySelector(".edit-image").value.trim(),
            link: form.querySelector(".edit-link").value.trim(),
            note: form
                .querySelector(".edit-note")
                .value.trim()
                .slice(0, NOTE_MAX),
            priority:
                Number(form.querySelector(".edit-priority").value) || 2
        };

        const error = validateGift(data);

        if (error) {
            editStatus.textContent = error;
            editStatus.className = "status error edit-status";
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Wird gespeichert …";

        try {
            await updateDoc(doc(db, "gifts", id), data);
            await loadGifts();
        } catch (err) {
            console.error(err);
            editStatus.textContent =
                "Speichern fehlgeschlagen. Prüfe die Firestore-Regeln.";
            editStatus.className = "status error edit-status";
            submitButton.disabled = false;
            submitButton.textContent = "Speichern";
        }
    });

    return item;
}

function priorityOptionsHtml(selected) {
    return PRIORITY_OPTIONS.map((option) => `
        <option
            value="${option.value}"
            ${option.value === selected ? "selected" : ""}
        >
            ${option.stars} ${option.text}
        </option>
    `).join("");
}

function getPriority(gift) {
    const value = Number(gift.priority);
    return value >= 1 && value <= 3 ? value : 2;
}

function getPriorityStars(priority) {
    return (
        PRIORITY_OPTIONS.find((option) => option.value === priority) ||
        PRIORITY_OPTIONS[1]
    ).stars;
}

function setBusy(button, text) {
    button.disabled = true;
    button.textContent = text;
}

function setStatus(text, type = "") {
    status.textContent = text;
    status.className = "status " + type;
}

function isValidUrl(value) {
    try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol);
    } catch {
        return false;
    }
}

function escapeHtml(value = "") {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function createFallbackImage() {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">
            <rect width="100%" height="100%" fill="#261c36"/>
            <text x="60" y="74" text-anchor="middle"
                  font-family="Segoe UI, Arial" font-size="42"
                  fill="#cfc2ab">🎁</text>
        </svg>
    `;

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
