<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 Meine Weihnachtswunschliste</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a472a, #2d5a3d);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #c41e3a;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .add-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .add-form h2 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .btn {
            background: #c41e3a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }
        
        .btn:hover {
            background: #a01830;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .gifts-list {
            list-style: none;
        }
        
        .gift-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .gift-item.reserved {
            background: #f0f0f0;
            opacity: 0.6;
            border-color: #bbb;
        }
        
        .gift-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .gift-info {
            flex: 1;
        }
        
        .gift-info h3 {
            margin-bottom: 8px;
            color: #333;
        }
        
        .gift-info a {
            color: #c41e3a;
            text-decoration: none;
            font-weight: 600;
        }
        
        .gift-info a:hover {
            text-decoration: underline;
        }
        
        .gift-price {
            display: block;
            margin-top: 5px;
            color: #666;
            font-size: 14px;
        }
        
        .reserve-checkbox {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .reserve-checkbox input {
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
        
        .reserve-checkbox span {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        
        @media (max-width: 600px) {
            .gift-item {
                flex-direction: column;
                text-align: center;
            }
            
            .reserve-checkbox {
                width: 100%;
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 Meine Weihnachtswunschliste</h1>
        <p class="subtitle">Hier findest du meine Geschenkideen – markiere, was du schon geschenkt hast!</p>
        
        <!-- Formular zum Hinzufügen -->
        <div class="add-form">
            <h2>Neues Geschenk hinzufügen</h2>
            <div class="form-group">
                <label for="productLink">Produkt-Link (Amazon, Thalia, etc.)</label>
                <input type="url" id="productLink" placeholder="https://..." required>
            </div>
            <div class="form-group">
                <label for="productName">Produktname (optional, wird automatisch ausgefüllt)</label>
                <input type="text" id="productName" placeholder="Wird automatisch ausgelesen">
            </div>
            <button class="btn" id="addBtn" onclick="addGift()">Geschenk hinzufügen</button>
        </div>
        
        <!-- Geschenkeliste -->
        <div id="giftsList">
            <div class="loading">Lade Geschenkeliste...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            updateDoc, 
            doc,
            deleteDoc,
            query,
            orderBy
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // HIER DEINE FIREBASE-KONFIGURATION EINFÜGEN
        const firebaseConfig = {
              apiKey: "AIzaSyAlmVEiqvYL8FaDj1J14tpq-Mg8zOxAy6U",
                authDomain: "weihnachtsliste-241226.firebaseapp.com",
                projectId: "weihnachtsliste-241226",
                storageBucket: "weihnachtsliste-241226.firebasestorage.app",
                messagingSenderId: "243572027003",
                appId: "1:243572027003:web:2b9ca250ff47c50cd07cde"
        };

        // Firebase initialisieren
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const giftsCollection = collection(db, 'gifts');

        let gifts = [];

        // Geschenkeliste laden und anzeigen
        const q = query(giftsCollection, orderBy('createdAt', 'desc'));
        onSnapshot(q, (snapshot) => {
            gifts = [];
            snapshot.forEach((doc) => {
                gifts.push({ id: doc.id, ...doc.data() });
            });
            renderGifts();
        });

        // Geschenke rendern
        window.renderGifts = function() {
            const container = document.getElementById('giftsList');
            
            if (gifts.length === 0) {
                container.innerHTML = '<div class="loading">Noch keine Geschenke hinzugefügt 🎁</div>';
                return;
            }
            
            container.innerHTML = '<ul class="gifts-list">' + 
                gifts.map(gift => `
                    <li class="gift-item ${gift.reserved ? 'reserved' : ''}">
                        <img src="${gift.image || 'https://via.placeholder.com/120?text=Kein+Bild'}" 
                             alt="${gift.name}" 
                             onerror="this.src='https://via.placeholder.com/120?text=Fehler'">
                        <div class="gift-info">
                            <h3>${gift.name}</h3>
                            <a href="${gift.link}" target="_blank">Zum Produkt →</a>
                            ${gift.price ? `<span class="gift-price">${gift.price}</span>` : ''}
                            <button class="delete-btn" onclick="deleteGift('${gift.id}')">Löschen</button>
                        </div>
                        <div class="reserve-checkbox">
                            <input type="checkbox" 
                                   ${gift.reserved ? 'checked' : ''} 
                                   onchange="toggleReserve('${gift.id}', ${!gift.reserved})">
                            <span>schon geschenkt</span>
                        </div>
                    </li>
                `).join('') + 
                '</ul>';
        };

        // Neues Geschenk hinzufügen
        window.addGift = async function() {
            const linkInput = document.getElementById('productLink');
            const nameInput = document.getElementById('productName');
            const addBtn = document.getElementById('addBtn');
            
            const link = linkInput.value.trim();
            if (!link) {
                alert('Bitte gib einen Produkt-Link ein!');
                return;
            }
            
            addBtn.disabled = true;
            addBtn.textContent = 'Lade...';
            
            try {
                // Produktinfos von der Seite holen (einfache Version)
                const productData = await fetchProductInfo(link);
                
                await addDoc(giftsCollection, {
                    name: nameInput.value.trim() || productData.name || 'Unbekanntes Produkt',
                    link: link,
                    image: productData.image || '',
                    price: productData.price || '',
                    reserved: false,
                    createdAt: new Date()
                });
                
                linkInput.value = '';
                nameInput.value = '';
            } catch (error) {
                console.error('Fehler:', error);
                alert('Fehler beim Hinzufügen. Bitte versuche es nochmal.');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Geschenk hinzufügen';
            }
        };

        // Produktinfos von der Zielseite holen
        async function fetchProductInfo(url) {
            // Hinweis: Das funktioniert nur für Seiten ohne CORS-Schutz
            // Für eine echte App brauchst du ein Backend oder eine API
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                const html = data.contents;
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Titel extrahieren
                let name = doc.querySelector('h1')?.textContent?.trim() || 
                          doc.querySelector('title')?.textContent?.trim() || 
                          'Produkt';
                
                // Bild extrahieren (Open Graph)
                let image = doc.querySelector('meta[property="og:image"]')?.content || '';
                
                // Preis extrahieren (sehr einfach)
                let price = '';
                const priceElement = doc.querySelector('[class*="price"], [id*="price"]');
                if (priceElement) {
                    price = priceElement.textContent.trim();
                }
                
                return { name, image, price };
            } catch (error) {
                console.error('Konnte Produktinfos nicht laden:', error);
                return { name: '', image: '', price: '' };
            }
        }

        // Geschenk als reserviert markieren
        window.toggleReserve = async function(giftId, isReserved) {
            try {
                await updateDoc(doc(db, 'gifts', giftId), {
                    reserved: isReserved
                });
            } catch (error) {
                console.error('Fehler beim Aktualisieren:', error);
                alert('Fehler beim Markieren. Bitte versuche es nochmal.');
            }
        };

        // Geschenk löschen
        window.deleteGift = async function(giftId) {
            if (!confirm('Möchtest du dieses Geschenk wirklich löschen?')) {
                return;
            }
            
            try {
                await deleteDoc(doc(db, 'gifts', giftId));
            } catch (error) {
                console.error('Fehler beim Löschen:', error);
                alert('Fehler beim Löschen. Bitte versuche es nochmal.');
            }
        };
    </script>
</body>
</html>
