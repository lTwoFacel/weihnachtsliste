<style>
:root {
    color-scheme: dark;

    --bg: #0e1d17;
    --surface: #1a3125;
    --surface-2: #234233;
    --ink: #060b08;
    --border: #f1e2b8;

    --text: #fff3d1;
    --muted: #d3c6a3;

    --gold: #e5b046;
    --gold-dark: #b98a26;
    --red: #b3202f;
    --red-hover: #c9303f;
    --burgundy: #5a1a25;
    --green: #2f7d57;
    --green-text: #eafbe9;
    --error-bg: #5a1a25;
    --error-text: #ffd9d3;

    --bw: 3px;
    --shadow: 5px 5px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
}

* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px 44px;
    color: var(--text);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(229, 176, 70, 0.14) 0,
            transparent 40%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(179, 32, 47, 0.16) 0,
            transparent 40%
        ),
        var(--bg);
    font-family: "Segoe UI", system-ui, -apple-system, Tahoma, Verdana, Arial, sans-serif;
    line-height: 1.5;
}

.page {
    width: min(880px, 100%);
    margin: 0 auto;
}

/* ---------- Header: goldene Tafel ---------- */
.header {
    position: relative;
    margin-bottom: 34px;
    padding: 22px 24px 24px;
    color: var(--ink);
    background: var(--gold);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow), 0 0 0 var(--bw) var(--border);
}

.header-avatar {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 84px;
    height: 84px;
    overflow: hidden;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow-sm);
}

.header-avatar img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.eyebrow {
    margin: 0 0 8px;
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

h1 {
    max-width: calc(100% - 110px);
    margin: 0;
    color: var(--ink);
    font-family: "Mountains of Christmas", Georgia, serif;
    font-size: clamp(2.3rem, 7vw, 3.9rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.02;
    hyphens: manual;
    overflow-wrap: break-word;
}

.subtitle {
    max-width: 520px;
    margin: 14px 0 0;
    color: #2a1c05;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.55;
}

/* ---------- Listenkopf ---------- */
.status {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 16px;
    padding: 0;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

.status.error {
    padding: 12px 14px;
    color: var(--error-text);
    background: var(--error-bg);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow-sm);
    letter-spacing: 0;
    text-transform: none;
}

/* ---------- Liste ---------- */
.gift-grid {
    display: grid;
    gap: 18px;
}

.gift-card {
    position: relative;
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr) 220px;
    gap: 22px;
    align-items: center;
    padding: 16px;
    background: var(--surface);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow), 0 0 0 var(--bw) rgba(241, 226, 184, 0.28);
}

.gift-card.prio-high {
    background: var(--burgundy);
    box-shadow: var(--shadow), 0 0 0 var(--bw) var(--gold);
}

.gift-card.is-reserved {
    background: var(--green);
    box-shadow: var(--shadow), 0 0 0 var(--bw) rgba(241, 226, 184, 0.28);
}

.gift-image-wrap {
    width: 112px;
    height: 112px;
    padding: 6px;
    overflow: hidden;
    background: #fff;
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
}

.gift-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

.gift-card.is-reserved .gift-image {
    opacity: 0.6;
}

.gift-info {
    min-width: 0;
}

/* ---------- Priorität ---------- */
.prio {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.prio-stars {
    color: var(--gold);
    font-size: 0.95rem;
    letter-spacing: 2px;
}

.prio.level-3 {
    color: var(--gold);
}

.gift-card.is-reserved .prio,
.gift-card.is-reserved .prio-stars {
    color: var(--green-text);
}

.gift-title {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 1.14rem;
    font-weight: 800;
    line-height: 1.25;
    overflow-wrap: anywhere;
}

.gift-price {
    margin: 0;
    color: var(--gold);
    font-size: 1.02rem;
    font-weight: 800;
}

.gift-card.is-reserved .gift-price {
    color: var(--green-text);
}

/* ---------- Notiz ---------- */
.gift-note {
    margin: 8px 0 0;
    padding-left: 10px;
    color: var(--muted);
    border-left: 3px solid var(--gold);
    font-size: 0.88rem;
    line-height: 1.45;
    white-space: pre-line;
    overflow-wrap: anywhere;
}

.gift-card.is-reserved .gift-note {
    color: var(--green-text);
    border-left-color: var(--green-text);
}

/* ---------- Etiketten als schwarze Pills ---------- */
.tag {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 10px;
    color: var(--text);
    background: var(--ink);
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    overflow-wrap: anywhere;
}

.tag-open {
    color: var(--gold);
}

/* ---------- Buttons ---------- */
.gift-actions {
    display: grid;
    gap: 10px;
}

.product-link,
.reserve-button {
    display: flex;
    width: 100%;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
    font: 800 0.9rem "Segoe UI", system-ui, -apple-system, Tahoma, Verdana, Arial, sans-serif;
    letter-spacing: 0.04em;
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.product-link {
    color: var(--ink);
    background: var(--text);
}

.reserve-button {
    color: var(--text);
    background: var(--red);
    cursor: pointer;
}

.product-link:hover,
.reserve-button:hover:not(:disabled) {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
}

.reserve-button:hover:not(:disabled) {
    background: var(--red-hover);
}

.product-link:active,
.reserve-button:active:not(:disabled) {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
}

.reserve-button:disabled {
    color: var(--muted);
    background: var(--surface-2);
    cursor: wait;
}

.release-button {
    color: var(--ink);
    background: var(--gold);
}

.release-button:hover:not(:disabled) {
    background: #f0be5a;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
}

.empty-state {
    padding: 28px;
    color: var(--muted);
    background: var(--surface);
    border: var(--bw) dashed var(--border);
    border-radius: 6px;
    text-align: center;
}

.footer-note {
    max-width: 560px;
    margin: 36px auto 0;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
    text-align: center;
}

/* ---------- Namensdialog ---------- */
.name-gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(6, 11, 8, 0.94);
}

.name-gate[hidden] {
    display: none !important;
}

.name-dialog {
    width: min(420px, 100%);
    padding: 26px 24px 24px;
    background: var(--gold);
    border: var(--bw) solid var(--ink);
    border-radius: 6px;
    box-shadow: var(--shadow), 0 0 0 var(--bw) var(--border);
}

.name-dialog h2 {
    margin: 0 0 8px;
    color: var(--ink);
    font-family: "Mountains of Christmas", Georgia, serif;
    font-size: 2.3rem;
    font-weight: 700;
    line-height: 1.05;
}

.name-dialog p {
    margin: 0 0 18px;
    color: #2a1c05;
    font-weight: 600;
}

.name-label {
    display: block;
    margin: 0 0 6px;
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
}

.name-input {
    width: 100%;
    min-height: 50px;
    padding: 10px 12px;
    color: var(--ink);
    background: #fff;
    border: var(--bw) solid var(--ink);
    border-radius: 4px;
    box-shadow: var(--shadow-sm);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
}

.name-input::placeholder {
    color: #7b6a45;
}

.name-dialog .reserve-button {
    margin-top: 18px;
}

/* ---------- Tablet ---------- */
@media (max-width: 700px) {
    .gift-card {
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 14px 16px;
        align-items: start;
    }

    .gift-image-wrap {
        width: 96px;
        height: 96px;
    }

    .gift-actions {
        grid-column: 1 / -1;
        grid-template-columns: 1fr 1fr;
    }
}

/* ---------- Handy ---------- */
@media (max-width: 560px) {
    :root {
        --bw: 2px;
        --shadow: 4px 4px 0 var(--ink);
        --shadow-sm: 2px 2px 0 var(--ink);
    }

    body {
        padding: 16px 12px 30px;
    }

    .header {
        margin-bottom: 24px;
        padding: 16px 16px 18px;
    }

    .header-avatar {
        top: 14px;
        right: 14px;
        width: 48px;
        height: 48px;
    }

    .eyebrow {
        margin-bottom: 4px;
        font-size: 0.7rem;
    }

    h1 {
        max-width: calc(100% - 60px);
        font-size: clamp(1.9rem, 9.5vw, 2.5rem);
        hyphens: auto;
        -webkit-hyphens: auto;
    }

    .subtitle {
        margin-top: 10px;
        font-size: 0.92rem;
        line-height: 1.5;
    }

    .subtitle-more {
        display: none;
    }

    .status {
        margin-bottom: 12px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
    }

    .gift-grid {
        gap: 14px;
    }

    .gift-card {
        grid-template-columns: 84px minmax(0, 1fr);
        gap: 12px 14px;
        padding: 12px;
    }

    .gift-image-wrap {
        width: 84px;
        height: 84px;
        padding: 4px;
    }

    .prio {
        font-size: 0.68rem;
    }

    .gift-title {
        margin-bottom: 4px;
        font-size: 1.02rem;
    }

    .gift-price {
        font-size: 0.95rem;
    }

    .gift-note {
        font-size: 0.84rem;
    }

    .tag {
        margin-top: 8px;
        font-size: 0.72rem;
    }

    .product-link,
    .reserve-button {
        min-height: 48px;
        padding: 8px;
        font-size: 0.8rem;
    }

    .footer-note {
        margin-top: 26px;
        font-size: 0.76rem;
    }
}

@media (max-width: 360px) {
    .gift-card {
        grid-template-columns: 72px minmax(0, 1fr);
    }

    .gift-image-wrap {
        width: 72px;
        height: 72px;
    }

    .gift-actions {
        grid-template-columns: 1fr;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
